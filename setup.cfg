[metadata]
name = rulea
version = 2.0.0
description = Embeddable, safe and explainable decision language for Python
author = tanuki276
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/tanuki276/rulea
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.9

[options.entry_points]
console_scripts =
    rulea = rulea.cli:main
